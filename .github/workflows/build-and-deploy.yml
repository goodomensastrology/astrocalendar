name: Build & Deploy AstroCal Feed

on:
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate transits.ics
        run: |
          python main.py

      - name: Verify output
        run: |
          if [ ! -f transits.ics ]; then
            echo "❌ transits.ics not found!"
            exit 1
          fi
          echo "✅ transits.ics generated"
          ls -lh transits.ics

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
